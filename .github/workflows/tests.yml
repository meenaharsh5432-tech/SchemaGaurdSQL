name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      # Disposable CI database credentials only.
      POSTGRES_PASSWORD: sg_admin_ci_only
      DATABASE_URL: postgresql+psycopg://sg_reader:sg_reader_local_dev_2026@127.0.0.1:5433/schemaguard
      AUDIT_DATABASE_URL: postgresql+psycopg://sg_audit_writer:sg_audit_local_dev_2026@127.0.0.1:5433/schemaguard
      REDIS_URL: redis://127.0.0.1:6380/0
      RESULT_CACHE_TTL_SECONDS: "60"
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen2.5-coder:3b

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.4"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Start PostgreSQL and Redis
        run: docker compose up -d --wait postgres redis

      - name: Initialize audit schema
        run: |
          docker compose exec -T postgres \
            psql -U sg_admin -d schemaguard \
            -v ON_ERROR_STOP=1 < database/002_audit.sql

      - name: Run tests without live LLM
        run: |
          unset RUN_LIVE_LLM_TESTS
          python -m pytest -q

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color postgres redis

      - name: Stop services
        if: always()
        run: docker compose down --volumes
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build